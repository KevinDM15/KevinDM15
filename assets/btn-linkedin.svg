<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 44">
  <style>
    text { font-family: 'SFMono-Regular','Cascadia Code',Menlo,Consolas,monospace; }
    .chev { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
    @media (prefers-reduced-motion: reduce) { .chev { animation: none; } }
  </style>
  <rect x="1" y="1" width="118" height="42" rx="10" fill="#131009" stroke="#3A3226" stroke-width="1.5"/>
  <text x="18" y="28" font-size="14" fill="#F0A73E" class="chev">❯</text>
  <text x="36" y="28" font-size="14" fill="#EADFC8">linkedin</text>
</svg>
