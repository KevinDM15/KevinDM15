<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="'SFMono-Regular','Cascadia Code',Menlo,Consolas,monospace">
  <style>
    text { font-family: 'SFMono-Regular','Cascadia Code',Menlo,Consolas,monospace; }
    .r { opacity: 0; transform: translateY(6px); animation: rise .5s ease-out forwards; }
    .d1 { animation-delay: 1.1s; }
    .d2 { animation-delay: 1.5s; }
    .d3 { animation-delay: 1.9s; }
    @keyframes rise { to { opacity: 1; transform: none; } }
    .type { clip-path: inset(-20% 100% -20% 0); animation: typing .8s steps(6) .3s forwards; }
    @keyframes typing { to { clip-path: inset(-20% -2% -20% 0); } }
    .caret { opacity: 0; animation: blink 1.1s steps(1) 2.4s infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .dot { animation: pulse 3s ease-in-out infinite; }
    .dot2 { animation-delay: .4s; }
    .dot3 { animation-delay: .8s; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .r, .caret { opacity: 1; transform: none; }
      .type { clip-path: none; }
    }
  </style>

  <rect x="1.5" y="1.5" width="877" height="377" rx="14" fill="#131009" stroke="#3A3226" stroke-width="1.5"/>

  <circle class="dot"      cx="28" cy="30" r="5.5" fill="#F0A73E"/>
  <circle class="dot dot2" cx="50" cy="30" r="5.5" fill="#7FB8A9"/>
  <circle class="dot dot3" cx="72" cy="30" r="5.5" fill="#8D7F66"/>
  <text x="440" y="35" text-anchor="middle" font-size="13" fill="#8D7F66">kevin@dm15 : zellij — ~/readme</text>
  <text x="848" y="35" text-anchor="end" font-size="12" fill="#5C5240">CO · UTC−5</text>
  <line x1="1.5" y1="54" x2="878.5" y2="54" stroke="#241E14" stroke-width="1.5"/>

  <text x="32" y="112" font-size="19" fill="#F0A73E" font-weight="bold">❯</text>
  <text x="56" y="112" font-size="19" fill="#EADFC8" class="type">whoami</text>

  <text x="32" y="188" font-size="48" font-weight="bold" fill="#EADFC8" class="r d1">Kevin Díaz</text>
  <text x="32" y="230" font-size="19" fill="#8D7F66" class="r d2">Desarrollador autodidacta de Colombia.</text>
  <text x="32" y="264" font-size="16" fill="#7FB8A9" class="r d3">Go · TypeScript · React Native · y un profundo amor por la terminal.</text>

  <text x="32" y="332" font-size="19" fill="#F0A73E" font-weight="bold">❯</text>
  <rect class="caret" x="56" y="316" width="11" height="21" fill="#F0A73E"/>
</svg>
