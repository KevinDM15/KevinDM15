<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" font-family="'SFMono-Regular','Cascadia Code',Menlo,Consolas,monospace">
  <style>
    text { font-family: 'SFMono-Regular','Cascadia Code',Menlo,Consolas,monospace; }
    .r { opacity: 0; transform: translateY(6px); animation: rise .5s ease-out forwards; }
    .r1 { animation-delay: .2s; }
    .r2 { animation-delay: .45s; }
    .r3 { animation-delay: .7s; }
    .r4 { animation-delay: .95s; }
    .fade { opacity: 0; animation: fadein .6s ease-out 1.5s forwards; }
    @keyframes rise { to { opacity: 1; transform: none; } }
    @keyframes fadein { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .r, .fade { opacity: 1; transform: none; }
    }
  </style>

  <rect x="1.5" y="1.5" width="877" height="247" rx="14" fill="#131009" stroke="#3A3226" stroke-width="1.5"/>
  <text x="32" y="42" font-size="14" fill="#F0A73E" letter-spacing="2">❯ stack</text>

  <g class="r r1">
    <text x="32" y="79" font-size="16" fill="#EADFC8">Go</text>
    <line x1="200" y1="74" x2="760" y2="74" stroke="#3A3226" stroke-dasharray="2 6"/>
    <rect x="776" y="59" width="72" height="22" rx="5" fill="#F0A73E" fill-opacity="0.14" stroke="#F0A73E" stroke-opacity="0.55"/>
    <text x="812" y="74" text-anchor="middle" font-size="12" fill="#F0A73E">expert</text>
  </g>

  <g class="r r2">
    <text x="32" y="117" font-size="16" fill="#EADFC8">TypeScript</text>
    <line x1="200" y1="112" x2="760" y2="112" stroke="#3A3226" stroke-dasharray="2 6"/>
    <rect x="776" y="97" width="72" height="22" rx="5" fill="#F0A73E" fill-opacity="0.14" stroke="#F0A73E" stroke-opacity="0.55"/>
    <text x="812" y="112" text-anchor="middle" font-size="12" fill="#F0A73E">expert</text>
  </g>

  <g class="r r3">
    <text x="32" y="155" font-size="16" fill="#EADFC8">React / RN</text>
    <line x1="200" y1="150" x2="712" y2="150" stroke="#3A3226" stroke-dasharray="2 6"/>
    <rect x="728" y="135" width="120" height="22" rx="5" fill="#7FB8A9" fill-opacity="0.12" stroke="#7FB8A9" stroke-opacity="0.55"/>
    <text x="788" y="150" text-anchor="middle" font-size="12" fill="#7FB8A9">intermediate</text>
  </g>

  <g class="r r4">
    <text x="32" y="193" font-size="16" fill="#EADFC8">Python</text>
    <line x1="200" y1="188" x2="712" y2="188" stroke="#3A3226" stroke-dasharray="2 6"/>
    <rect x="728" y="173" width="120" height="22" rx="5" fill="#7FB8A9" fill-opacity="0.12" stroke="#7FB8A9" stroke-opacity="0.55"/>
    <text x="788" y="188" text-anchor="middle" font-size="12" fill="#7FB8A9">intermediate</text>
  </g>

  <text x="32" y="230" font-size="13" fill="#8D7F66" class="fade">daily drivers: LazyVim · Zellij · Starship · Alacritty · Zsh</text>
</svg>
